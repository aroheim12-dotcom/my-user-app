name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract www.zip if exists
        run: |
          if [ -f www.zip ]; then
            unzip www.zip -d www
          fi

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/app --save

      - name: Setup & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UserApp-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
